name: build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x86_64
          - os: ubuntu-26.04-arm
            arch: aarch64
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: build-image
        shell: bash
        run: |
          pushd "$(mktemp -d)"
          curl -f -L https://github.com/haskell-wasm/rust-alpine-mimalloc/archive/refs/heads/master.tar.gz | tar xz --strip-components=1
          podman build \
            --pull \
            --tag rust:alpine-mimalloc \
            .
          popd

      - name: build & test
        shell: bash
        run: |
          podman run \
            --env GITHUB_REF_NAME=$GITHUB_REF_NAME \
            --init \
            --rm \
            --volume $PWD:/workspace \
            --workdir /workspace \
            rust:alpine-mimalloc \
            /workspace/build-static.sh

      - name: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaryen-${{ matrix.arch }}-linux-static
          path: binaryen-*-${{ matrix.arch }}-linux-static.tar.gz

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: download-artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: publish-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create ${{ github.ref_name }} binaryen-*-linux-static.tar.gz \
            --title ${{ github.ref_name }} \
            --notes-file /dev/null \
            --latest \
            --verify-tag
